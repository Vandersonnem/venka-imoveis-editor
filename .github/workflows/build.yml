name: Venka Imóveis Editor - build completo

# Native compilers and existing launch checks are reused, not replaced.
# No fork, push or release is created by this workflow.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: venka-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    uses: ./.github/workflows/build-app.yml
    with:
      venka_only: true
    secrets: inherit
  mobile:
    uses: ./.github/workflows/mobile.yml
    secrets: inherit
  collect:
    name: Conferir e reunir os instaladores Venka
    needs: [desktop, mobile]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Venka-Editor-*
          path: bundles
          merge-multiple: true
      - name: Conferir formatos, gerar nomes estáveis e incluir código fonte
        env:
          FORK: ${{ github.repository }}
        run: python3 scripts/venka/prepare_release.py --bundles bundles --out release --repository "$FORK" --archive-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: venka-editor-instaladores-e-fontes
          path: release/*
          if-no-files-found: error
